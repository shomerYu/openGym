# Creates the Android signing keystore, once, without a terminal.
#
# Why this exists: an APK only installs *over* an existing one when both are signed with the
# same key. Debug builds are signed with a throwaway key the runner generates, so every build
# forces an uninstall (and wipes your logged workouts). One stable key fixes that forever.
#
# This job generates the key on the runner and writes it straight into this repo's Actions
# secrets over the API. The key is never printed, never uploaded, and never committed — which
# matters, because this repository is public.
#
# SETUP (all doable in a phone browser):
#   1. github.com/settings/personal-access-tokens/new — fine-grained token, this repo only,
#      Repository permissions -> Secrets: Read and write. Expire it in 7 days.
#   2. Repo -> Settings -> Secrets and variables -> Actions -> add it as KEYSTORE_ADMIN_TOKEN.
#   3. Actions -> "Create signing keystore" -> Run workflow -> type CREATE.
#   4. Delete KEYSTORE_ADMIN_TOKEN and revoke the token. It is only needed for this one run.
#
# TRADE-OFF, read before running: a GitHub secret cannot be read back out. The key will exist
# only inside this repo's secrets, so you cannot back it up. If the repo or the secret is ever
# lost, you lose the ability to update an installed app and have to uninstall once more (export
# your data first). If you want a backup, generate the keystore in a terminal instead and paste
# the base64 in by hand — see docs/MOBILE.md.
name: Create signing keystore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CREATE to confirm'
        required: true
        type: string

permissions: {}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "CREATE" ]; then
            echo "::error::Type CREATE in the confirm box to run this."
            exit 1
          fi

      # Overwriting a key you are already shipping is the one unrecoverable mistake here:
      # every phone with the old APK would refuse the next update. Refuse instead.
      - name: Refuse to replace an existing key
        env:
          GH_TOKEN: ${{ secrets.KEYSTORE_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::KEYSTORE_ADMIN_TOKEN is not set — see the setup notes at the top of this workflow."
            exit 1
          fi
          if gh api "repos/$REPO/actions/secrets" --jq '.secrets[].name' | grep -qx 'ANDROID_KEYSTORE_BASE64'; then
            echo "::error::ANDROID_KEYSTORE_BASE64 already exists. Delete it by hand first if you really mean to replace your signing key — every installed copy of the app will then need a reinstall."
            exit 1
          fi

      - name: Generate the keystore and store it as secrets
        env:
          GH_TOKEN: ${{ secrets.KEYSTORE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/opengym.keystore"
          PASS="$(openssl rand -base64 30 | tr -d '\n=/+' | cut -c1-32)"
          # Masked so it cannot surface in this log through any later command.
          echo "::add-mask::$PASS"

          keytool -genkeypair -noprompt \
            -keystore "$KS" -storetype PKCS12 \
            -storepass "$PASS" -keypass "$PASS" \
            -alias opengym -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=openGym, O=openGym, C=CH"

          B64="$(base64 -w0 "$KS")"
          echo "::add-mask::$B64"

          gh secret set ANDROID_KEYSTORE_BASE64   --body "$B64"
          gh secret set ANDROID_KEYSTORE_PASSWORD --body "$PASS"
          gh secret set ANDROID_KEY_ALIAS         --body "opengym"
          gh secret set ANDROID_KEY_PASSWORD      --body "$PASS"

          # Printed while the file still exists. The fingerprint is public information — it is
          # what `apksigner verify` shows for any APK you ship — so it is safe in this log, and
          # it lets you confirm later builds are signed with this same key.
          echo "Signing key created and stored. Certificate fingerprint:"
          keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$PASS" -alias opengym \
            | grep -i 'SHA-256' || true
          shred -u "$KS" 2>/dev/null || rm -f "$KS"

      - name: What to do next
        run: |
          echo "1. Delete the KEYSTORE_ADMIN_TOKEN secret and revoke the token — it is done."
          echo "2. Run the 'Android APK' workflow. It will now build a SIGNED release APK."
          echo "3. Export a backup in the app, uninstall, install the signed APK, import the backup."
          echo "   That is the last uninstall. Every build after this installs straight over the last."
