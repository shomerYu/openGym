# Builds the sideloadable Android APK.
#
# GitHub's ubuntu runners ship the Android SDK and Java, so this needs no local
# Android Studio install — run it from the Actions tab (or push a v* tag) and
# download the APK from the run's artifacts.
#
# Signing is optional. Without secrets you get the debug APK, which installs on
# any phone and is fine for your own use. Set the four secrets below and you get
# a release APK signed with your own key instead — use that one if you want to
# ship updates over an existing install, since Android only accepts an update
# signed with the same key as the version already on the device.
#
#   ANDROID_KEYSTORE_BASE64   base64 of your .keystore  (base64 -w0 my.keystore)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the release below. Everything else here only reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      # VITE_MOBILE build + `cap sync` — bakes the CDN media base in and copies
      # the web bundle into android/. Must run before Gradle sees the project.
      - name: Build web bundle and sync Capacitor
        working-directory: frontend
        env:
          # Same number Gradle stamps as versionCode, so what Settings shows and what Android
          # reports are never two different things.
          RUN_NUMBER: ${{ github.run_number }}
        run: VITE_BUILD="$((1000 + RUN_NUMBER))" npm run build:mobile

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -uo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No signing keystore configured — building the debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          # Pasting a few thousand base64 characters through a browser field routinely picks up
          # wrapped lines and stray spaces. None of that is part of the data, so strip it rather
          # than failing on it — the old `echo | base64 -d` died with a bare "invalid input".
          CLEAN="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')"
          if ! printf '%s' "$CLEAN" | base64 -d > "$KS" 2>/dev/null; then
            # The length and shape of the value are not the key itself, and knowing them turns
            # "invalid input" into an obvious diagnosis — a pasted path is ~40 characters, a real
            # 2048-bit keystore is a few thousand.
            echo "Secret length after removing whitespace: ${#CLEAN} characters."
            echo "For reference, a 2048-bit keystore is roughly 3000-4000 characters of base64."
            case "$CLEAN" in
              *-----BEGIN*|*-----END*)
                echo "It looks like PEM output — certutil -encode and openssl wrap the data in BEGIN/END header lines, which are not base64. Use plain base64 encoding instead." ;;
              /*|*:\\*|*.keystore|*.jks|*.p12)
                echo "It looks like a file PATH rather than the file's CONTENTS. The secret must hold the encoded bytes, not where the file lives." ;;
            esac
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Set it straight from the file so nothing can mangle it in transit — from a clone or a Codespace: gh secret set ANDROID_KEYSTORE_BASE64 --repo ${{ github.repository }} --body \"\$(base64 -w0 /path/to/opengym.keystore)\"  (on macOS: base64 -i /path/to/opengym.keystore | tr -d '\\n')"
            exit 1
          fi
          # A truncated paste still decodes cleanly but is not a keystore, and a wrong password
          # only surfaces at signing time — several minutes of Gradle later. Check both now.
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore decoded but could not be opened. Either ANDROID_KEYSTORE_BASE64 is incomplete (a truncated copy-paste), ANDROID_KEYSTORE_PASSWORD is wrong, or ANDROID_KEY_ALIAS does not match the alias used with keytool -genkeypair."
            exit 1
          fi
          echo "Keystore decoded and opened. Signing certificate:"
          keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias "$KS_ALIAS" | grep -i 'SHA-256' || true
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: frontend/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --no-daemon -PversionCodeOverride="$((1000 + RUN_NUMBER))"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "env:KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass "env:KS_KEY_PASS" \
            --out "$RUNNER_TEMP/openGym.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/openGym.apk"

      - name: Build debug APK
        if: steps.keystore.outputs.signed == 'false'
        working-directory: frontend/android
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleDebug --no-daemon -PversionCodeOverride="$((1000 + RUN_NUMBER))"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/openGym.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: openGym-apk
          path: ${{ runner.temp }}/openGym.apk
          if-no-files-found: error

      # An Actions artifact is a zip behind a login, which makes updating the app a five-step
      # errand. A release asset is a plain file at a permanent URL, so the phone can fetch the
      # APK directly and the newest one always lives at:
      #   https://github.com/<repo>/releases/latest/download/openGym.apk
      # Signed builds only — publishing a debug APK here would hand out something that cannot
      # install over a real one, under a link that implies it can.
      - name: Publish release
        if: steps.keystore.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VC="$((1000 + RUN_NUMBER))"
          VN="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' frontend/android/app/build.gradle)"
          cp "$RUNNER_TEMP/openGym.apk" openGym.apk
          gh release create "build-$VC" openGym.apk \
            --title "openGym $VN ($VC)" \
            --latest \
            --notes "Signed APK built from ${{ github.sha }}.

          Installs straight over the previous version — no uninstall, data kept.

          Always-newest link: https://github.com/${{ github.repository }}/releases/latest/download/openGym.apk"
